name: Update data and deploy

# Pulls fresh scores and lines from nflverse, re-checks the tiebreaker engine against every
# season since 2002, rebuilds the site and publishes it. If validation fails, nothing ships.
on:
  push:
    branches: [main]          # deploy on every code or pick-trade change
  workflow_dispatch: {}       # "Run workflow" button for a manual refresh
  schedule:
    # Times are UTC. Game windows (US Central): Thu 7pm-11pm, Sun noon-11pm, Mon 7pm-11pm.
    - cron: '*/30 0-5 * * 5'      # Thu night games (Fri 00:00-05:30 UTC)
    - cron: '*/30 13-23 * * 0'    # Sunday: morning London games through evening
    - cron: '*/30 0-5 * * 1'      # Sunday night game
    - cron: '*/30 0-5 * * 2'      # Monday night game
    - cron: '17 */6 * * *'        # every 6 hours otherwise: betting lines, schedule changes, Saturday games

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tools (jsdom pre-renders each page for search engines)
        run: npm ci --no-audit --no-fund

      - name: Fetch latest games, scores and lines
        run: node scripts/fetch-data.js

      - name: Check for draft-pick trades our file is missing (opens a GitHub issue, which emails the owner)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-trades.js
          if [ -s trade-report.md ]; then
            TITLE="Pick trade check: possible missing draft-pick trade"
            if [ -z "$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')" ]; then
              gh issue create --title "$TITLE" --body-file trade-report.md
            fi
          fi

      - name: Check for NBA trades that moved draft picks (opens a GitHub issue)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-nba-trades.js
          if [ -s nba-trade-report.md ]; then
            TITLE="NBA pick check: trade moved draft picks"
            if [ -z "$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')" ]; then
              gh issue create --title "$TITLE" --body-file nba-trade-report.md
            fi
          fi

      - name: Set Bracket Challenge lock times (NFL + NBA)
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-lock.js

      - name: Fetch latest NBA schedule and scores
        continue-on-error: true
        run: node scripts/fetch-nba.js

      - name: Validate NBA tiebreakers against the last three seasons' play-in and playoff fields
        run: node scripts/validate-nba.js

      - name: Validate tiebreaker engine against every season since 2002
        run: node scripts/validate.js

      - name: Build site
        env:
          SITE_NAME: ${{ vars.SITE_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: node scripts/build.js

      - name: Keep the accounts database awake (free Supabase projects pause after 7 idle days)
        continue-on-error: true
        run: |
          URL=$(node -e "console.log(require('./data/site.json').SUPABASE_URL||'')")
          KEY=$(node -e "console.log(require('./data/site.json').SUPABASE_ANON_KEY||'')")
          if [ -n "$URL" ]; then curl -sS -o /dev/null -w "supabase ping %{http_code}\n" "$URL/rest/v1/scenarios?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"; fi

      - name: Save the refreshed data file to the repo
        run: |
          if ! git diff --quiet data/games.csv data/nba; then
            git config user.name "clinch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/games.csv data/nba
            git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
